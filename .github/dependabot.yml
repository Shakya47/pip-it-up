version: 2
updates:
  # --- npm: ONE entry for the whole pnpm workspace (one lockfile), so a dependency used in several
  # packages is bumped in one PR, not one PR per folder. Monthly, everything in a single grouped PR.
  # Major versions are skipped: they need hand work (TypeScript, Vitest, React majors break the build).
  # Security fixes are separate ("Dependabot security updates" in the repo settings) and still come
  # as soon as an advisory is published; they are grouped into one PR too.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/*"
      - "/apps/*"
      - "/examples/*"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 2
    commit-message: { prefix: "chore(deps):" }
    ignore:
      - dependency-name: "@pip-it-up/*"
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dependencies:
        applies-to: version-updates
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]

  # --- GitHub Actions: keeps the CI-501 SHA pins current, one grouped PR a month ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
    open-pull-requests-limit: 1
    commit-message: { prefix: "chore(deps):" }
    groups:
      actions:
        patterns: ["*"]
