name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Required for npm provenance

    steps:
      - name: Checkout Repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2   # v4.0.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version: 22.x
          # Intentionally NO cache. Eliminates the cache-poisoning vector that the @tanstack/*
          # compromise (Oct 2025) chained through: a release job must never restore a cache that
          # a less-trusted workflow could have written. This workflow runs 1-2x per week, so a
          # ~30s cold install is irrelevant next to a poisoned-store publish.
          # Do NOT add `cache: 'pnpm'` here.

      # Trusted Publishing (OIDC) requires npm >= 11.5.1. Node 22.x bundles npm 10.9,
      # which never attempts the OIDC exchange and fails with ENEEDAUTH. npm >= 10.2.0
      # is the floor for --provenance, NOT for trusted publishing. Do not remove this step.
      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@11

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm exec turbo run build --filter='./packages/*'

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@c8bada60c408975afd1a20b3db81d6eee6789308   # v1.4.9
        with:
          version: pnpm version-packages
          publish: pnpm exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
