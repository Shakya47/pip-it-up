name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
      
      - name: Forbid pull_request_target
        run: |
          if grep -rnE "^\s*pull_request_target\s*:" .github/workflows/; then
            echo "::error::pull_request_target is forbidden. Use pull_request. See CONTRIBUTING.md > Workflow changes."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413   # v6.1.0
          
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
                
      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter='./packages/*'
        
      - name: Lint
        run: pnpm exec turbo run lint --filter='./packages/*'
        
      - name: Test
        run: pnpm exec turbo run test --filter='./packages/*' -- --coverage
        
      - name: Build
        run: pnpm exec turbo run build --filter='./packages/*'

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: '**/coverage/'
          if-no-files-found: ignore
