name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2
      
      - name: Forbid pull_request_target
        run: |
          if grep -rnE "^\s*pull_request_target\s*:" .github/workflows/; then
            echo "::error::pull_request_target is forbidden. Use pull_request. See CONTRIBUTING.md > Workflow changes."
            exit 1
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2   # v4.0.0
          
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020   # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
                
      - name: Typecheck
        run: pnpm exec turbo run typecheck --filter='./packages/*'
        
      - name: Lint
        run: pnpm exec turbo run lint --filter='./packages/*'
        
      - name: Test
        run: pnpm exec turbo run test --filter='./packages/*' -- --coverage
        
      - name: Build
        run: pnpm exec turbo run build --filter='./packages/*'

      - name: Upload coverage
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882   # v4.4.3
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: '**/coverage/'
          if-no-files-found: ignore
