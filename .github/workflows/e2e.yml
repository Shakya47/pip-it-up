name: E2E

# Real-browser tests (apps/e2e). Two shapes:
# - pull_request and push to main: Chrome only (vanilla, react, next, playground + packaging). This
#   is the job that guards changes. It is the only one that runs on its own.
# - workflow_dispatch (Actions > E2E > Run workflow): everything. Chrome in full (+ the packed
#   tarball test), Edge, Firefox and WebKit, and real Safari on macOS. Run it when a browser update
#   or a change in core's browser handling might matter.
# Firefox, WebKit and Edge on GitHub's Linux runners differ from a Mac: headless Linux Firefox does
# not open Document PiP windows, and Linux WebKit has no video PiP. The full local matrix
# (`pnpm e2e` on a Mac) is the cross-browser check; see apps/e2e/README.md.
# The changesets "Version Packages" PR is opened with GITHUB_TOKEN and does not trigger
# pull_request workflows; the push to main after merging it runs the Chrome job.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chrome:
    name: e2e (chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413   # v6.1.0

      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chrome is a system install (apt), so there is nothing to cache.
      - name: Install browser and system dependencies
        run: pnpm --filter @pip-it-up/e2e exec playwright install --with-deps chrome

      - name: Build packages
        run: pnpm exec turbo run build --filter='./packages/*'

      # CI=true: retries 2 and lib/known-bugs.ts (listed app bugs run as expected failures, so a NEW
      # failure or a FIXED bug turns this red). `set -f` keeps the shell from globbing
      # `--project=*-chrome`.
      - name: Run e2e
        env:
          # PK5 (tests/tarball.spec.ts): npm-installs the packed tarballs into a temp app. Manual runs only.
          E2E_TARBALL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
          # Which targets' dev servers (and projects) playwright.config.ts starts for this job.
          E2E_TARGETS: playground,vanilla,react,next
        run: |
          set -f
          pnpm e2e ${{ github.event_name == 'workflow_dispatch' && '--project=*-chrome --project=packaging --project=tarball' || '--project=vanilla-chrome --project=react-chrome --project=next-chrome --project=playground-chrome --project=packaging' }}

      - name: Bug report
        if: failure()
        run: pnpm e2e:bug-report ci-chrome

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: e2e-chrome-${{ github.run_attempt }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
            apps/e2e/reports/
            apps/e2e/logs/
          if-no-files-found: ignore
          retention-days: 14

  # Manual runs only: the other browsers, each with the full target set.
  browsers:
    name: e2e (${{ matrix.name }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `projects` is the Playwright --project filter; `install` is what `playwright install` needs.
        include:
          - name: msedge
            install: msedge
            projects: '--project=*-msedge'
          - name: firefox
            install: firefox
            projects: '--project=*-firefox'
          - name: webkit
            install: webkit
            projects: '--project=*-webkit'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413   # v6.1.0

      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @pip-it-up/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Bundled browsers (firefox, webkit) are cached per Playwright version. msedge is a system
      # install (apt), so there is nothing to cache for it.
      - name: Cache Playwright browsers
        if: matrix.install == 'firefox' || matrix.install == 'webkit'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9   # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.install }}

      - name: Install browser and system dependencies
        run: pnpm --filter @pip-it-up/e2e exec playwright install --with-deps ${{ matrix.install }}

      - name: Build packages
        run: pnpm exec turbo run build --filter='./packages/*'

      - name: Run e2e
        env:
          E2E_TARGETS: playground,vanilla,react,next
        run: |
          set -f
          pnpm e2e ${{ matrix.projects }}

      - name: Bug report
        if: failure()
        run: pnpm e2e:bug-report ci-${{ matrix.name }}

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: e2e-${{ matrix.name }}-${{ github.run_attempt }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
            apps/e2e/reports/
            apps/e2e/logs/
          if-no-files-found: ignore
          retention-days: 14

  # Real Safari through safaridriver (apps/e2e/scripts/safari.mjs, flows/safari.md). Playwright's
  # WebKit is not Safari: it has no working video PiP. Manual runs only (macOS minutes cost more).
  safari:
    name: e2e (safari)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413   # v6.1.0

      - name: Use Node.js 22.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm exec turbo run build --filter='./packages/*'

      - name: Enable Safari remote automation
        run: sudo safaridriver --enable

      - name: Run Safari rows
        run: node apps/e2e/scripts/safari.mjs

      - name: Upload results and server logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: e2e-safari-${{ github.run_attempt }}
          path: |
            apps/e2e/test-results/safari.json
            apps/e2e/logs/
          if-no-files-found: ignore
          retention-days: 14
