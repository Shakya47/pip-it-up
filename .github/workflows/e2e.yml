name: E2E

# Real-browser tests (apps/e2e). Two shapes:
# - pull_request: the PR subset. Browser differences live in core, so the vanilla target runs in
#   every browser; framework targets and the playground smoke run in Chrome only.
# - push to main, manual: the full matrix, one job per browser. (No nightly schedule: nothing
#   changes between pushes, and it cost macOS minutes every day. Run it manually when a browser
#   update might matter.)
# The changesets "Version Packages" PR is opened with GITHUB_TOKEN and does not trigger
# pull_request workflows; the push to main after merging it runs the full matrix.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # `pr` / `full` are Playwright --project filters; `pr_targets` / `full_targets` are the
        # E2E_TARGETS for them (the targets those projects use: only their dev servers start;
        # packaging and tarball need none). Keep each pair in sync. `install` is what
        # `playwright install` needs.
        include:
          - name: chrome
            install: chrome
            pr: '--project=vanilla-chrome --project=react-chrome --project=next-chrome --project=playground-chrome --project=packaging'
            pr_targets: 'playground,vanilla,react,next'
            full: '--project=*-chrome --project=packaging --project=tarball'
            full_targets: 'playground,vanilla,react,next'
          - name: msedge
            install: msedge
            pr: '--project=vanilla-msedge'
            pr_targets: 'vanilla'
            full: '--project=*-msedge'
            full_targets: 'playground,vanilla,react,next'
          - name: firefox
            install: firefox
            pr: '--project=vanilla-firefox'
            pr_targets: 'vanilla'
            full: '--project=*-firefox'
            full_targets: 'playground,vanilla,react,next'
          - name: webkit
            install: webkit
            pr: '--project=vanilla-webkit'
            pr_targets: 'vanilla'
            full: '--project=*-webkit'
            full_targets: 'playground,vanilla,react,next'

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2   # v4.0.0

      - name: Use Node.js 22.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af   # v4.1.0
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @pip-it-up/e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Bundled browsers (firefox, webkit) are cached per Playwright version. chrome and msedge
      # are system installs (apt), so there is nothing to cache for them.
      - name: Cache Playwright browsers
        if: matrix.install == 'firefox' || matrix.install == 'webkit'
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25   # v5.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.install }}

      - name: Install browser and system dependencies
        run: pnpm --filter @pip-it-up/e2e exec playwright install --with-deps ${{ matrix.install }}

      - name: Build packages
        run: pnpm exec turbo run build --filter='./packages/*'

      # CI=true: retries 2, the msedge projects, and lib/known-bugs.ts (listed app bugs run as
      # expected failures, so a NEW failure or a FIXED bug turns this red). `set -f` keeps the
      # shell from globbing `--project=*-chrome`.
      - name: Run e2e
        env:
          # PK5 (tests/tarball.spec.ts): npm-installs the packed tarballs into a temp app. Full runs only.
          E2E_TARBALL: ${{ github.event_name != 'pull_request' && '1' || '' }}
          # Which targets' dev servers (and projects) playwright.config.ts starts for this job.
          E2E_TARGETS: ${{ github.event_name == 'pull_request' && matrix.pr_targets || matrix.full_targets }}
        run: |
          set -f
          pnpm e2e ${{ github.event_name == 'pull_request' && matrix.pr || matrix.full }}

      - name: Bug report
        if: failure()
        run: pnpm e2e:bug-report ci-${{ matrix.name }}

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882   # v4.4.3
        with:
          name: e2e-${{ matrix.name }}-${{ github.run_attempt }}
          path: |
            apps/e2e/playwright-report/
            apps/e2e/test-results/
            apps/e2e/reports/
            apps/e2e/logs/
          if-no-files-found: ignore
          retention-days: 14

  # Real Safari through safaridriver (apps/e2e/scripts/safari.mjs, flows/safari.md). Playwright's
  # WebKit is not Safari: it has no working video PiP. Full runs only (macOS minutes cost more).
  safari:
    name: e2e (safari)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683   # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2   # v4.0.0

      - name: Use Node.js 22.x
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af   # v4.1.0
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm exec turbo run build --filter='./packages/*'

      - name: Enable Safari remote automation
        run: sudo safaridriver --enable

      - name: Run Safari rows
        run: node apps/e2e/scripts/safari.mjs

      - name: Upload results and server logs
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882   # v4.4.3
        with:
          name: e2e-safari-${{ github.run_attempt }}
          path: |
            apps/e2e/test-results/safari.json
            apps/e2e/logs/
          if-no-files-found: ignore
          retention-days: 14
