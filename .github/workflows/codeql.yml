name: CodeQL

# Not on pull_request: every Dependabot PR re-ran it on each rebase. Code reaches main through a
# PR, so the push to main scans every change once; the weekly run picks up new queries.
on:
  push:
    branches: [main]
  schedule:
    # Weekly, so newly published queries run against unchanged code.
    - cron: "0 6 * * 1"

permissions:
  security-events: write   # upload the SARIF results
  actions: read            # read workflow metadata
  contents: read           # clone

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee   # v4.39.0
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee   # v4.39.0
